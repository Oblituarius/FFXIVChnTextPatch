buildscript {
	ext {
		kotlinVersion = '1.3.11'
		springBootVersion = '2.1.0.RELEASE'
	}
	repositories {
		maven { url "https://repo.spring.io/milestone" }
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
		classpath("org.jetbrains.kotlin:kotlin-allopen:${kotlinVersion}")
	}
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'application'

sourceSets {
    main {
		java.srcDir('src/main/java')
		resources.srcDir('src/main/resources')
    }
}

compileJava {
	sourceCompatibility = 1.8
	targetCompatibility = 1.8
	destinationDirectory = file('build/bin')
}

repositories {
	maven { url "https://repo.spring.io/milestone" }
	mavenCentral()
}

dependencies {
	testImplementation(
        'junit:junit:4.12'
    )
	implementation("com.jcraft:jzlib:1.1.3")
	implementation("org.nlpcn:nlp-lang:1.7.6")
	implementation("com.google.code.gson:gson:2.8.5")
	implementation(files("libs/univocity-parsers-2.9.1.jar")) 
}

application {
	mainClass = "name.yumao.ffxiv.chn.FFXIVPatchMain"
}

jar {
	manifest {
		attributes(
				'Main-Class': 'name.yumao.ffxiv.chn.FFXIVPatchMain',
				'Class-Path': configurations.runtimeClasspath.collect { 'lib/' + it.getName() }.join(' ')
		)
	}
	from {
		fileTree('build/bin')
	}
	from {
		fileTree('src/main/resources')
	}
}

task fatJar(type: Jar, dependsOn: compileJava) {
	archiveBaseName = project.name
	archiveClassifier = 'fat'
	manifest {
		attributes(
			'Main-Class': 'name.yumao.ffxiv.chn.FFXIVPatchMain',
			'Implementation-Title': 'FFXIVChnTextPatch',
			'Implementation-Version': '1.0.0'
		)
	}
	
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	
	from fileTree('build/bin')
	from fileTree('src/main/resources')
	
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(GroovyCompile) {
	groovyOptions.encoding = "MacRoman"
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

task jpackageExe(type: Exec, dependsOn: fatJar) {
	description = 'Create Windows EXE using jpackage'
	group = 'build'
	
	def jpackage = new File("D:\\Applications\\Windows\\Program Files\\Eclipse Adoptium\\jdk-16.0.1\\bin\\jpackage.exe")
	
	if (!jpackage.exists()) {
		jpackage = new File(System.getProperty("java.home")).toPath().resolve("bin").resolve("jpackage.exe").toFile()
	}
	
	if (!jpackage.exists()) {
		throw new GradleException("jpackage not found. jpackage requires Java 17 or later.")
	}
	
	commandLine jpackage, 
		'--input', 'build/libs',
		'--name', 'FFXIVChnTextPatch',
		'--main-jar', 'FFXIVChnTextPatch-fat.jar',
		'--main-class', 'name.yumao.ffxiv.chn.FFXIVPatchMain',
		'--type', 'exe',
		'--dest', 'build/dist',
		'--vendor', 'FFXIV Community',
		'--description', 'FFXIV Text Patch Tool',
		'--java-options', '-Dfile.encoding=UTF-8',
		'--java-options', '-Xmx2048m',
		'--win-menu',
		'--win-menu-group', 'FFXIV'
}